---
- name: Colocar SELinux em modo permissivo
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: SELINUX=permissive
    create: true 

- name: Aplicar setenforce 0 quando o SELinux estiver ativo
  ansible.builtin.command: setenforce 0
  when: ansible_selinux is defined and ansible_selinux.status == "enabled"
  changed_when: false
  ignore_errors: true

- name: Install packages
  yum:
    name:
        - epel-release
        - openssl
        - python3
        - python3-pip
        - python3-psycopg2
    state: present

# - name: Update pip packages
#   pip:
#     name:
#         - setuptools
#         - pip
#     state: latest

# Sem `executable`, o módulo pip usa `<ansible_python_interpreter> -m pip`,
# instalando o psycopg2 no mesmo Python que o Ansible usa (ex.: 3.9 no Rocky 8,
# enquanto python3-psycopg2/pip3 atendem só o python3 do sistema, 3.6).
# psycopg2-binary evita compilar (não exige gcc/pg_config/python-devel).
- name: Install pip packages
  pip:
    name:
        - psycopg2-binary

- name: Install Key-repo
  rpm_key:
    key: https://download.postgresql.org/pub/repos/yum/keys/RPM-GPG-KEY-PGDG

- name: Install postgresql Repo.
  dnf:
   name: "{{ postgresql_enablerepo }}"
   state: present
   disable_gpg_check: true

- name: Disable package postgresql
  command: dnf module disable postgresql -y

- name: PostgreSQL packages are installed.
  dnf:
    name: "{{ __postgresql_packages }}"
    state: present

- name: PostgreSQL database is initialized.
  command: "{{ postgresql_bin_path }} initdb"
  ignore_errors: true