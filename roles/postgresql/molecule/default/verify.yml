---
# Purpose: assert that the instance really ended up in the expected state.
# Molecule calls this playbook with `molecule verify`.
- name: Verify
  hosts: all
  gather_facts: true # Quicker, if you do not need facts
  tasks:
    - name: Coletar estado dos serviços
      ansible.builtin.service_facts:

    - name: postgresql habilitado e rodando
      ansible.builtin.assert:
        that:
          - ansible_facts.services['postgresql-{{ postgresql_version }}.service'].state == 'running'
          - ansible_facts.services['postgresql-{{ postgresql_version }}.service'].status == 'enabled'

    - name: Portas de escuta publicadas
      ansible.builtin.wait_for:
        port: "{{ item }}"
        timeout: 5
      loop: [5432]
      when: install_postgresql
