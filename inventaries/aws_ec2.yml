plugin: amazon.aws.aws_ec2     
regions:
  - us-east-1
filters:
  "tag:type": db      
hostnames:
  - instance-id
keyed_groups:
  - key: tags['Name']
    prefix: ''                 
compose:
  ansible_connection: amazon.aws.aws_ssm
  ansible_aws_ssm_region: us-east-1
  ansible_aws_ssm_bucket_name: awx-ssm-transfer
  ansible_remote_tmp: /tmp/ansible-${USER}